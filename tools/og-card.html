<!doctype html><html><head><meta charset="utf-8">
<!-- Source for og-image.png (the 1200x630 link-preview card). Render steps are in README.md. -->
<title>Social card</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#111214 radial-gradient(rgba(61,220,132,.14) 1.2px,transparent 1.4px) 0 0/22px 22px;color:#eceef0}
img{display:block;width:1200px;height:400px}
.band{height:230px;box-sizing:border-box;padding:34px 72px 0;border-top:1px solid #2a2d31;display:flex;justify-content:space-between;align-items:flex-start}
.t{font:800 50px/1.05 'Sora',sans-serif;letter-spacing:-.03em}
.s{font:400 22px/1.4 'JetBrains Mono',monospace;color:#c3c7cc;margin-top:18px}
.u{font:600 22px 'JetBrains Mono',monospace;color:#3DDC84;border:1px solid #3DDC84;border-radius:999px;padding:10px 20px;margin-top:4px}
</style></head><body>
<img src="../assets/images/cover.png" alt="">
<div class="band"><div><div class="t">Senior Android Engineer<br>&amp; Tech Lead</div></div>
<div style="display:flex;flex-direction:column;align-items:flex-end"><div class="u">sougandh.dev</div><div class="s">Kotlin · Compose · Sydney</div></div></div>
</body></html>
