<head>
<meta charset="utf-8">
<title>Sougandh Manikkoth Paremmal · Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1411;
  --bg-elevated: #121e18;
  --bg-panel: #16231c;
  --fg: #f2eee3;
  --muted: #c9d3cc;
  --line: #2e4a3b;
  --soft: rgba(86, 217, 139, .18);
  --chip-text: #dde6e0;
  --card-bg: #111b16;
  --card-muted: #3a5446;
  --code-bg: #2b2b2b;
  --code-header: #3c3f41;
  --code-fg: #a9b7c6;
  --code-keyword: #cc7832;
  --code-string: #6a8759;
  --code-annotation: #bbb529;
  --ring-dot: #56d98b;
  --accent: #56d98b;
}
html[data-theme="light"] {
  --bg: #f2f3f1;
  --bg-elevated: #ffffff;
  --bg-panel: #ffffff;
  --fg: #111214;
  --muted: #404b52;
  --line: #d9dedd;
  --soft: rgba(35, 122, 75, .1);
  --chip-text: #2d373e;
  --card-bg: #f7faf7;
  --card-muted: #4a6158;
  --code-bg: #ffffff;
  --code-header: #f3f3f3;
  --code-fg: #000000;
  --code-keyword: #0033b3;
  --code-string: #067d17;
  --code-annotation: #9e880d;
  --ring-dot: #237a4b;
  --accent: #237a4b;
}
body{margin:0;background:var(--bg) radial-gradient(var(--soft) 1.2px,transparent 1.4px) 0 0/22px 22px;font-family:'Sora',Georgia,serif;color:var(--fg)}
a{color:var(--accent)}a:hover{color:#8fe0ad}
.dots{background-image:radial-gradient(var(--soft) 1.2px,transparent 1.4px);background-size:22px 22px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes floatY2{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(10px) rotate(-4deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinRev{to{transform:rotate(-360deg)}}
@keyframes bob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(-55deg)}}
@keyframes type{from{max-width:0}to{max-width:40ch}}
@keyframes caret{50%{opacity:0}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes pop{0%,70%{transform:scale(.6);opacity:0}80%{transform:scale(1.06);opacity:1}88%,100%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(220%)}}
.float{animation:floatY 5s ease-in-out infinite}
.float-slow{animation:floatY 7s ease-in-out infinite}
.phone{animation:floatY2 6s ease-in-out infinite}
.ring{animation:spin 40s linear infinite}
.ring-rev{animation:spinRev 28s linear infinite}
.gear{animation:spin 8s linear infinite;transform-origin:center}
.head{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.eye{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.arm{animation:wave 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}
.line{display:block;overflow:hidden;white-space:nowrap;max-width:0;animation:type 1.2s steps(24) forwards}
.l2{animation-delay:1.3s}.l3{animation-delay:2.6s}.l4{animation-delay:3.9s}
.caret{animation:caret 1s steps(1) infinite}
.star{animation:twinkle 3s ease-in-out infinite}
.s2{animation-delay:.8s}.s3{animation-delay:1.6s}.s4{animation-delay:2.2s}
.tip{animation:glow 1.6s ease-in-out infinite}
.chip{animation:pop 5.5s ease-out 1 forwards}
.shine{animation:shimmer 2.4s ease-in-out infinite}
.tech{position:absolute;width:58px;height:58px;display:grid;place-items:center;box-sizing:border-box;border-radius:16px;background:var(--card-bg);border:1px solid var(--line);box-shadow:0 12px 28px rgba(0,0,0,.35);transform:rotate(var(--r));animation:drift var(--d) ease-in-out var(--delay) infinite}
.tech svg{width:30px;height:30px;display:block}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(var(--r))}33%{transform:translate(7px,-12px) rotate(calc(var(--r) * -.4))}66%{transform:translate(-5px,-5px) rotate(calc(var(--r) * 1.4))}}
.still *{animation:none !important}
html,body{overflow:hidden}
.still .line{max-width:40ch}
@media (prefers-reduced-motion: reduce){*{animation:none !important}.line{max-width:40ch}.chip{opacity:1 !important}}
</style>
</head>

<script>
  const root = document.documentElement;
  const setTheme = (theme) => {
    const isLight = theme === 'light';
    root.setAttribute('data-theme', theme);
    root.style.setProperty('--bg', isLight ? '#f2f3f1' : '#0d1411');
    root.style.setProperty('--bg-elevated', isLight ? '#ffffff' : '#121e18');
    root.style.setProperty('--bg-panel', isLight ? '#ffffff' : '#16231c');
    root.style.setProperty('--fg', isLight ? '#111214' : '#f2eee3');
    root.style.setProperty('--muted', isLight ? '#404b52' : '#c9d3cc');
    root.style.setProperty('--line', isLight ? '#d9dedd' : '#2e4a3b');
    root.style.setProperty('--soft', isLight ? 'rgba(35,122,75,.1)' : 'rgba(86,217,139,.18)');
    root.style.setProperty('--chip-text', isLight ? '#2d373e' : '#dde6e0');
    root.style.setProperty('--card-bg', isLight ? '#f7faf7' : '#111b16');
    root.style.setProperty('--card-muted', isLight ? '#4a6158' : '#3a5446');
    root.style.setProperty('--code-bg', isLight ? '#ffffff' : '#2b2b2b');
    root.style.setProperty('--code-header', isLight ? '#f3f3f3' : '#3c3f41');
    root.style.setProperty('--code-fg', isLight ? '#000000' : '#a9b7c6');
    root.style.setProperty('--code-keyword', isLight ? '#0033b3' : '#cc7832');
    root.style.setProperty('--code-string', isLight ? '#067d17' : '#6a8759');
    root.style.setProperty('--code-annotation', isLight ? '#9e880d' : '#bbb529');
    root.style.setProperty('--ring-dot', isLight ? '#237a4b' : '#56d98b');
    root.style.setProperty('--accent', isLight ? '#237a4b' : '#56d98b');
    document.body.style.background = `var(--bg) radial-gradient(var(--soft) 1.2px, transparent 1.4px) 0 0/22px 22px`;
  };

  const initTheme = () => {
    const preferred = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    const theme = localStorage.getItem('theme') || preferred;
    setTheme(theme === 'light' || theme === 'dark' ? theme : preferred);
  };

  window.addEventListener('message', (event) => {
    const incoming = event.data && typeof event.data === 'object' ? event.data.theme : null;
    if (incoming === 'light' || incoming === 'dark') setTheme(incoming);
  });

  initTheme();
</script>
