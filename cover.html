<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sougandh MP · Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D1411 radial-gradient(rgba(61,220,132,.16) 1.2px,transparent 1.4px) 0 0/22px 22px;font-family:'Bricolage Grotesque',Georgia,serif;color:#F2EEE3}
a{color:#3DDC84}a:hover{color:#8BF0B8}
.dots{background-image:radial-gradient(rgba(61,220,132,.16) 1.2px,transparent 1.4px);background-size:22px 22px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes floatY2{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(10px) rotate(-4deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinRev{to{transform:rotate(-360deg)}}
@keyframes bob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(-55deg)}}
@keyframes type{from{max-width:0}to{max-width:40ch}}
@keyframes caret{50%{opacity:0}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes pop{0%,70%{transform:scale(.6);opacity:0}80%{transform:scale(1.06);opacity:1}88%,100%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(220%)}}
.float{animation:floatY 5s ease-in-out infinite}
.float-slow{animation:floatY 7s ease-in-out infinite}
.phone{animation:floatY2 6s ease-in-out infinite}
.ring{animation:spin 40s linear infinite}
.ring-rev{animation:spinRev 28s linear infinite}
.gear{animation:spin 8s linear infinite;transform-origin:center}
.head{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.eye{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.arm{animation:wave 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}
.line{display:block;overflow:hidden;white-space:nowrap;max-width:0;animation:type 1.2s steps(24) forwards}
.l2{animation-delay:1.3s}.l3{animation-delay:2.6s}.l4{animation-delay:3.9s}
.caret{animation:caret 1s steps(1) infinite}
.star{animation:twinkle 3s ease-in-out infinite}
.s2{animation-delay:.8s}.s3{animation-delay:1.6s}.s4{animation-delay:2.2s}
.tip{animation:glow 1.6s ease-in-out infinite}
.chip{animation:pop 5.5s ease-out 1 forwards}
.shine{animation:shimmer 2.4s ease-in-out infinite}
.tech{position:absolute;width:58px;height:58px;display:grid;place-items:center;box-sizing:border-box;border-radius:16px;background:#121E18;border:1px solid #2E4A3B;box-shadow:0 12px 28px rgba(0,0,0,.35);transform:rotate(var(--r));animation:drift var(--d) ease-in-out var(--delay) infinite}
.tech svg{width:30px;height:30px;display:block}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(var(--r))}33%{transform:translate(7px,-12px) rotate(calc(var(--r) * -.4))}66%{transform:translate(-5px,-5px) rotate(calc(var(--r) * 1.4))}}
.still *{animation:none !important}
html,body{overflow:hidden}
.still .line{max-width:40ch}
@media (prefers-reduced-motion: reduce){*{animation:none !important}.line{max-width:40ch}.chip{opacity:1 !important}}
</style>
</head>
